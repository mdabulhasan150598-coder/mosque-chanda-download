name: Build Mosque Chanda APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.mosque.chanda .
      - name: Install dependencies
        run: flutter pub add sqflite path intl public_file_saver google_sign_in
      - name: Add native JSON backup file picker
        run: |
          mkdir -p android/app/src/main/kotlin/com/mosque/chanda/mosque_chanda
          cat > android/app/src/main/kotlin/com/mosque/chanda/mosque_chanda/MainActivity.kt <<'KOTLIN'
          package com.mosque.chanda.mosque_chanda

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "mosque_chanda/file_picker"
              private val requestCode = 7412
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          if (call.method != "pickJsonBackup") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          if (pendingResult != null) {
                              result.error("PICKER_BUSY", "A file selection is already in progress.", null)
                              return@setMethodCallHandler
                          }
                          pendingResult = result
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/json"
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          try {
                              startActivityForResult(intent, requestCode)
                          } catch (e: Exception) {
                              pendingResult = null
                              result.error("PICKER_LAUNCH_FAILED", e.message, null)
                          }
                      }
              }

              @Deprecated("Deprecated in Android, retained for Activity result compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != this.requestCode) return
                  val callback = pendingResult ?: return
                  pendingResult = null
                  if (resultCode != Activity.RESULT_OK || data?.data == null) {
                      callback.success(null)
                      return
                  }
                  try {
                      val uri: Uri = data.data!!
                      val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                          ?: throw IllegalStateException("Unable to read selected file")
                      var name = "backup.json"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (index >= 0 && cursor.moveToFirst()) name = cursor.getString(index) ?: name
                      }
                      callback.success(mapOf("name" to name, "bytes" to bytes))
                  } catch (e: Exception) {
                      callback.error("FILE_READ_FAILED", e.message, null)
                  }
              }
          }
          KOTLIN
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: mosque-chanda-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mosque Chanda - Latest APK
          body: General-purpose mosque chanda app. Configure your mosque name on first use.
          target_commitish: main
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
