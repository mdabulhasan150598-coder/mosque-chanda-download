name: Build Mosque Chanda APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.mosque.chanda .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mosque-chanda-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mosque Chanda - Latest APK
          body: Latest installable APK for Mosque Chanda.
          target_commitish: main
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
